[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-proxy-manager"
version = "0.1.0"
description = "Small thread-safe and async-friendly rotating proxy pool for Python applications."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Giorgos" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"